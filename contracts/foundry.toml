[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "paris"
remappings = [
  "@uniswap/v3-core/=lib/v3-core/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[lint]
lint_on_build = false
