[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "paris"
remappings = [
  "@uniswap/v3-core/=lib/v3-core/",
  "forge-std/=lib/forge-std/src/",
]
disable_code_size_limit = true # tests only (the price-math harness inherits the vault); `forge build --sizes` still reports AvowVault against EIP-170
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[lint]
lint_on_build = false
